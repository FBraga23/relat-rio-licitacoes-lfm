name: Snapshot PNCP - 01h

on:
  schedule:
    - cron: "0 1 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compras-765741-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Preparar configuracao sem credenciais
        run: cp config.example.json config.json

      - name: Restaurar snapshot PNCP anterior
        id: restore-pncp
        uses: actions/cache/restore@v4
        with:
          path: cache/pncp_complementos.json
          key: pncp-snapshot-restore-${{ github.run_id }}
          restore-keys: |
            pncp-snapshot-

      - name: Atualizar snapshot PNCP
        id: snapshot
        continue-on-error: true
        run: python snapshot_pncp.py

      - name: Salvar snapshot PNCP
        if: always() && hashFiles('cache/pncp_complementos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: cache/pncp_complementos.json
          key: pncp-snapshot-${{ github.run_id }}

      - name: Validar resultado do snapshot
        if: steps.snapshot.outcome != 'success'
        run: |
          echo "A pre-coleta do PNCP nao concluiu 4/4 recortes."
          echo "O cache preservado ainda podera ser usado se estiver dentro do limite de 24 horas."
          exit 1
