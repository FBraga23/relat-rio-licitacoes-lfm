name: Snapshot PNCP - Madrugada

on:
  schedule:
    # Rodadas escalonadas e fora do minuto 00. Cada rodada reaproveita o cache
    # anterior e consulta apenas os recortes ainda ausentes/reprovados.
    - cron: "37 0 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "17 1 * * *"
      timezone: "America/Sao_Paulo"
    - cron: "7 2 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compras-765741-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Preparar configuracao sem credenciais
        run: cp config.example.json config.json

      - name: Restaurar snapshot PNCP anterior
        id: restore-pncp
        uses: actions/cache/restore@v5
        with:
          path: cache/pncp_complementos.json
          key: pncp-snapshot-restore-${{ github.run_id }}
          restore-keys: |
            pncp-snapshot-

      - name: Atualizar snapshot PNCP
        run: python snapshot_pncp.py

      - name: Salvar snapshot PNCP
        if: always() && hashFiles('cache/pncp_complementos.json') != ''
        uses: actions/cache/save@v5
        with:
          path: cache/pncp_complementos.json
          key: pncp-snapshot-${{ github.run_id }}

      - name: Resumo da pre-coleta
        if: always()
        run: |
          echo "A pre-coleta e cumulativa: resultados validos sao preservados."
          echo "As rodadas seguintes tentam somente os recortes que ainda estiverem faltando."
          echo "A rotina das 08h faz a validacao final e bloqueia o e-mail se nao houver dados suficientes."
